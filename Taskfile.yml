version: '3'

vars:
  GO_VERSION: 1.24
  MODULE_NAME: github.com/nimsforest/nimsforesttool

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install-deps:
    desc: Install Go dependencies
    cmds:
      - go mod download
      - go mod verify

  fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  fmt-check:
    desc: Check if code is formatted
    cmds:
      - test -z "$(go fmt ./...)"

  lint:
    desc: Run go vet (built-in linting)
    cmds:
      - go vet ./...


  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test-short:
    desc: Run short tests
    cmds:
      - go test -short -v ./...

  build-examples:
    desc: Build example applications
    cmds:
      - go build -o examples/example-tool examples/main.go

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -f examples/example-tool
      - rm -f coverage.out coverage.html

  ci:
    desc: Run CI pipeline (format check, lint, test)
    deps:
      - install-deps
    cmds:
      - task: fmt-check
      - task: lint
      - task: test

  mod-tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  mod-verify:
    desc: Verify Go modules
    cmds:
      - go mod verify

  security-check:
    desc: Run security checks
    cmds:
      - gosec ./...

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem ./...

  validate:
    desc: Validate library can be imported
    cmds:
      - go list -m {{.MODULE_NAME}}
      - go list ./...

  doc:
    desc: Generate and serve documentation
    cmds:
      - godoc -http=:6060

  tag-check:
    desc: Check if ready for git tagging
    deps:
      - mod-tidy
      - fmt-check
      - lint
      - vet
      - test
      - validate